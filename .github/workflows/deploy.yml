name: build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: cache godot editor and web template
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-web-1

      - name: download godot editor and web template
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot && cd ~/godot
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j templates.tpz templates/web_nothreads_release.zip templates/web_nothreads_debug.zip -d templates
          rm templates.tpz

      - name: install web template
        run: |
          dir=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dir"
          cp ~/godot/templates/*.zip "$dir/"

      - name: import project
        run: ~/godot/godot --headless --path . --import

      - name: run tests
        run: ~/godot/godot --headless --path . -s addons/gut/gut_cmdln.gd -gconfig=.gutconfig.json -gexit

      - name: export web
        run: |
          mkdir -p build/web
          ~/godot/godot --headless --path . --export-release Web build/web/index.html
          touch build/web/.nojekyll
          ls -la build/web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
